name: TSA installer release

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: >
          Ref imutavel de aifocusdev/AceOrca para o build: uma tag git ou o SHA completo (40
          hex) do commit. NUNCA um nome de branch (branch pode mudar entre o job de build e o
          de publish). Se vazio, usa a variavel de repositorio TSA_APP_REF.
        type: string
        required: false
      channel:
        type: choice
        required: true
        default: adhoc
        options: [adhoc, rc, stable]
      publish:
        type: boolean
        required: true
        default: false
  push:
    tags: ['tsa-installer-v*.*.*', 'tsa-installer-v*.*.*-rc.*']

# Least privilege por padrao: cada job declara so o que precisa. So o job publish
# escala para contents: write (necessario pra criar o GitHub Release).
permissions:
  contents: read

env:
  APP_REPOSITORY: aifocusdev/AceOrca

jobs:
  # Resolve app_ref (input) ou a variavel de repositorio TSA_APP_REF para um commit SHA
  # e falha se o valor apontar para uma branch (mutavel). Configurar em: Settings ->
  # Secrets and variables -> Actions -> Variables -> New repository variable "TSA_APP_REF"
  # (usado no trigger por tag, quando nao ha workflow_dispatch.inputs).
  resolve-app-ref:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app_commit: ${{ steps.resolve.outputs.app_commit }}
    steps:
      - name: Resolve e valida ref imutavel do app
        id: resolve
        env:
          APP_REF_INPUT: ${{ inputs.app_ref || vars.TSA_APP_REF }}
          GH_TOKEN: ${{ secrets.TSA_APP_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${APP_REF_INPUT:-}" ]; then
            echo "APP_REF ausente. Informe 'app_ref' no workflow_dispatch ou configure a variavel de repositorio TSA_APP_REF (tag ou SHA completo de $APP_REPOSITORY)." >&2
            exit 1
          fi
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${APP_REPOSITORY}.git"
          if [[ "$APP_REF_INPUT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            APP_COMMIT="$(printf '%s' "$APP_REF_INPUT" | tr '[:upper:]' '[:lower:]')"
          else
            if git ls-remote --heads "$REMOTE" "$APP_REF_INPUT" | grep -q .; then
              echo "APP_REF '$APP_REF_INPUT' e uma branch mutavel em $APP_REPOSITORY. Use uma tag ou o SHA completo do commit." >&2
              exit 1
            fi
            TAG_REFS="$(git ls-remote "$REMOTE" "refs/tags/${APP_REF_INPUT}")"
            if [ -z "$TAG_REFS" ]; then
              echo "Nao foi possivel resolver a tag '$APP_REF_INPUT' em $APP_REPOSITORY." >&2
              exit 1
            fi
            # tag anotada expoe a linha "<sha>^{}" com o commit dereferenciado por ultimo;
            # tag leve tem uma unica linha que ja e o commit.
            APP_COMMIT="$(printf '%s\n' "$TAG_REFS" | awk '{print $1}' | tail -1)"
          fi
          echo "app_commit=$APP_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Ref resolvida para o commit imutavel: $APP_COMMIT"

  macos:
    needs: [resolve-app-ref]
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ needs.resolve-app-ref.outputs.app_commit }}
          path: app
          token: ${{ secrets.TSA_APP_REPO_TOKEN }}
      - uses: pnpm/action-setup@v4
        with: { version: 12 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: app/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm run verify:tsa-macos-release
        working-directory: app
      - run: TSA_ADHOC_SIGN=1 pnpm run build:mac
        working-directory: app
      - name: Verify and normalize macOS package
        shell: bash
        run: |
          while IFS= read -r bundle; do
            codesign --deep --force --sign - "$bundle"
            codesign --verify --deep --strict "$bundle"
          done < <(find app/dist -maxdepth 3 -name TSA.app -print)
          pnpm --dir app run prepare:tsa-macos-release
      - run: mkdir -p artifacts && cp app/dist/*.dmg app/dist/*.zip artifacts/ || true
      - name: Record app commit actually built
        run: git -C app rev-parse HEAD > artifacts/app-commit.txt
      - uses: actions/upload-artifact@v4
        with: { name: tsa-macos, path: artifacts/* }

  windows:
    needs: [resolve-app-ref]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ needs.resolve-app-ref.outputs.app_commit }}
          path: app
          token: ${{ secrets.TSA_APP_REPO_TOKEN }}
      - uses: pnpm/action-setup@v4
        with: { version: 12 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: app/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm run build:win
        working-directory: app
      - run: New-Item -ItemType Directory -Force artifacts; Copy-Item app/dist/*setup*.exe artifacts/ -ErrorAction SilentlyContinue
      - name: Record app commit actually built
        run: git -C app rev-parse HEAD | Out-File -FilePath artifacts/app-commit.txt -Encoding utf8 -NoNewline
      - uses: actions/upload-artifact@v4
        with: { name: tsa-windows, path: artifacts/* }

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    needs: [resolve-app-ref, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TSA_RELEASE_STATE: DRAFT
      TSA_RELEASE_VERSION: ${{ github.ref_name }}
      TSA_RELEASE_CHANNEL: ${{ inputs.channel || 'adhoc' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ needs.resolve-app-ref.outputs.app_commit }}
          path: app
          token: ${{ secrets.TSA_APP_REPO_TOKEN }}
      - name: Record immutable app commit
        env:
          RESOLVED_APP_COMMIT: ${{ needs.resolve-app-ref.outputs.app_commit }}
        run: |
          set -euo pipefail
          TSA_APP_COMMIT="$(git -C app rev-parse HEAD)"
          echo "TSA_APP_COMMIT=$TSA_APP_COMMIT" >> "$GITHUB_ENV"
          if [ "$TSA_APP_COMMIT" != "$RESOLVED_APP_COMMIT" ]; then
            echo "Commit do app no publish ($TSA_APP_COMMIT) diverge do commit resolvido ($RESOLVED_APP_COMMIT)." >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Verify built commit matches registered commit
        run: |
          set -euo pipefail
          for platform_file in artifacts/tsa-macos/app-commit.txt artifacts/tsa-windows/app-commit.txt; do
            BUILT_COMMIT="$(cat "$platform_file")"
            if [ "$BUILT_COMMIT" != "$TSA_APP_COMMIT" ]; then
              echo "Commit buildado em $platform_file ($BUILT_COMMIT) diverge do commit registrado ($TSA_APP_COMMIT)." >&2
              exit 1
            fi
          done
          rm -f artifacts/tsa-macos/app-commit.txt artifacts/tsa-windows/app-commit.txt
      - name: Generate SHA-256 checksums for release assets
        # scripts/install-tsa-macos.sh baixa este arquivo do release para conferir o dmg antes
        # de instalar; sem ele o instalador falha sempre em "Checksum ausente".
        run: |
          set -euo pipefail
          : > artifacts/checksums-sha256.txt
          while IFS= read -r file; do
            sha256sum "$file" | awk -v name="$(basename "$file")" '{print $1"  "name}' >> artifacts/checksums-sha256.txt
          done < <(find artifacts -maxdepth 2 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) | sort)
          cat artifacts/checksums-sha256.txt
      - run: node scripts/generate-release-manifest.mjs
      - run: node scripts/verify-manifest.mjs manifests/tsa-release.json
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            artifacts/**
            manifests/tsa-release.json
