name: TSA installer release

# Só macOS: o Windows fica fora por decisão do Cadu.
# Os passos são os mesmos do scripts/publicar-release.sh: o workflow faz o build e
# chama o script com --sem-build. Sem "publish", é só ensaio e os artefatos
# ficam no upload do job.
# Ressalva: o checkout de APP_REF só funciona depois que a branch tsa/integracao
# existir no aifocusdev/AceOrca remoto.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão do instalador, por exemplo 0.3.0"
        type: string
        required: true
      publish:
        description: "Publicar (exige repositório público e Pages ligado)"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

env:
  APP_REPOSITORY: aifocusdev/AceOrca
  APP_REF: tsa/integracao

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          path: app
          token: ${{ secrets.TSA_APP_REPO_TOKEN }}
      # O script exige o app na branch tsa/integracao; o checkout deixa o HEAD solto.
      - run: git -C app checkout -B "$APP_REF"
      - uses: pnpm/action-setup@v4
        with: { version: 12 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: app/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm run verify:tsa-macos-release
        working-directory: app
      - run: TSA_ADHOC_SIGN=1 pnpm run build:mac
        working-directory: app
      - run: pnpm run prepare:tsa-macos-release
        working-directory: app
        env:
          TSA_RELEASE_VERSION: ${{ inputs.version }}
      - name: Conferir, gerar artefatos e publicar (se pedido)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TMPDIR: ${{ runner.temp }}
          PUBLISH: ${{ inputs.publish }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          flag=""
          if [ "$PUBLISH" = "true" ]; then flag="--publicar"; fi
          scripts/publicar-release.sh "$VERSION" --app app --sem-build $flag
      - uses: actions/upload-artifact@v4
        with:
          name: tsa-macos-${{ inputs.version }}
          path: ${{ runner.temp }}/tsa-release-*/*
